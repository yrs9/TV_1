name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Enable i386 architecture for 32-bit libs
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update

    - name: Install System Dependencies and Libraries
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          openjdk-17-jdk \
          ant \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          libffi-dev \
          libssl-dev \
          libc6:i386 \
          libstdc++6:i386 \
          zlib1g:i386

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade Cython==0.29.36 buildozer

    - name: Build APK with Detailed Logs
      run: |
        # استخدام مستوى تتبع 2 لإظهار سبب الخطأ بدقة في حال حدوثه
        buildozer -v --profile default android debug || buildozer --log_level=2 android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
